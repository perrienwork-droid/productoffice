<!-- STRUCTURAL RECIPE — Target ranges per content fragment -->
<!-- Based on 4 completed fragments (avg 471 lines) -->

<!--
TARGET PER TOPIC:
  Lines:          400-550
  Sections:       13-14 (with id + data-section)
  H2 headings:    13-14 (one per section — TOC reads these)
  H3 headings:    3-10 (as needed within sections)

SECTION SPLIT (data-section attribute):
  theory:         2-3 sections
  practical:      7-9 sections
  examples:       1 section

COMPONENTS:
  method-card:    4-19 (more for pattern-catalog topics, fewer for framework topics)
  callout:        5-8 (mix of tip/warning/info)
  checklist:      1-2
  template-card:  1-2
  process-steps:  0-4
  deep-dive:      2-3 <details> blocks (last one always "Further reading")
  connected:      4 topic links

STANDARD SECTION ORDER:
  1. "What X is and why it matters"     (theory)
  2. Framework/model section            (theory)
  3-9. Method/technique sections        (practical — bulk of the page)
  10. Templates & checklists            (practical)
  11. Real-world examples               (examples)
  12. Common pitfalls                    (practical)
  13. Connected Topics                  (no data-section)
  14. Deep-dive appendix                (no data-section)

TIER ADJUSTMENTS:
  Tier 1 (Core):     Full treatment. 450-550 lines. Rich examples.
  Tier 2 (Special):  Full treatment. 400-500 lines. Domain-specific depth.
  Tier 3 (Situational): Slightly lighter. 350-450 lines. More focused scope.
  Tier 4 (Reference): Lighter. 300-400 lines. More conceptual, fewer templates.
-->
